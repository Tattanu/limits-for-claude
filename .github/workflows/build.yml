name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Versione e chiave di firma
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 mancante: APK firmato con chiave debug"
          fi

      - name: Compila
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk "LimitsForClaude-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LimitsForClaude-${{ env.VERSION_NAME }}
          path: LimitsForClaude-*.apk

      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LimitsForClaude-*.apk
          generate_release_notes: true
